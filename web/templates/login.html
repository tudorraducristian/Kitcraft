{% extends "base.html" %}
{% block title %}Intră în cont{% endblock %}
{% block topbar_meta %}Autentificare{% endblock %}
{% block content %}
<main class="page page--narrow">
    <h1>Intră în cont</h1>
    {% if error %}
    <div class="callout" role="alert" style="border-left-color: var(--c-danger); background: var(--c-danger-soft); color: var(--c-danger-ink);">{{ error }}</div>
    {% endif %}
    <form class="card" method="post" action="/login">
        <div class="field">
            <label class="field__label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email" required autocomplete="username" value="{{ values.email or '' }}">
        </div>
        <div class="field">
            <label class="field__label" for="password">Parolă</label>
            <input class="input" type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <div class="row-actions">
            <button type="submit" class="btn">Intră</button>
            <a href="/register" class="btn btn--ghost">Fă-ți cont de client</a>
        </div>
    </form>
</main>
{% endblock %}
